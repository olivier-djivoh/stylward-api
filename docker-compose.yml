services:
  # ---------- Application PHP ----------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: saas_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - saas_network
    depends_on:
      - db
      - redis

  # ---------- Serveur web Nginx ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: saas_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - saas_network
    depends_on:
      - app

  # ---------- PostgreSQL ----------
  db:
    image: postgres:16-alpine
    container_name: saas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: saas_stylistes
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: motdepasse_tres_long_et_unique
    volumes:
      - saas_db_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - saas_network

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --save 60 1
    volumes:
      - saas_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - saas_network

  # ---------- Node.js (pour ton futur frontend React) ----------
  node:
    image: node:20-alpine
    container_name: saas_node
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: sh -c "tail -f /dev/null"
    networks:
      - saas_network

networks:
  saas_network:
    driver: bridge

volumes:
  saas_db_data:
  saas_redis_data:
